<p>Illustration of detected hand landmarks including indices and label:</p>
<img alt="Illustration of detected hand landmarks including indices and label" src="https://developers.google.com/static/mediapipe/images/solutions/hand-landmarks.png" width="1200" />

<h2 id="what-we-are-building">What we are building</h2>
<p>For every frame from the webcam, the program will:</p>
<ol>
<li>Read a frame with OpenCV.</li>
<li>Convert the frame from OpenCV's BGR channel order to RGB.</li>
<li>Ask MediaPipe's Gesture Recognizer to process the frame.</li>
<li>Draw hand landmarks, their connections, the gesture name, and its score.</li>
<li>Show the result and an estimated frame rate.</li>
</ol>
<p>The recognizer runs in <strong>video mode</strong>, so each frame also needs a timestamp that increases over time. See the <a href="https://ai.google.dev/edge/mediapipe/solutions/vision/gesture_recognizer/python">MediaPipe Gesture Recognizer Python guide</a> for the task workflow and model options.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="4" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">

<h2 id="before-you-start">Before you start</h2>
<p>From the repository root, install the project dependencies and run the example:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">pip install -r requirements.txt
</code></pre>
<p>The model bundle must be available at <code>models/gesture_recognizer.task</code> and can be downloaded from the <a href="https://developers.google.com/edge/mediapipe/solutions/vision/gesture_recognizer/index#models">Gesture Recognizer models section</a>. The camera number in <code>cv2.VideoCapture(...)</code> depends on your computer; this project currently uses <code>0</code>. Try another index if that is not your webcam.</p>
<p>The code below uses the MediaPipe Tasks API available in MediaPipe 1.1.1. In particular, its landmark drawing utilities live under <code>mp.tasks.vision</code>, not the older <code>mp.solutions</code> API.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="7" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-1--import-the-tools-and-select-the-model">Step 1 — Import the tools and select the model</h2>
<p>Add these imports and settings at the top of the program:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> time

<span class="hljs-keyword">import</span> cv2
<span class="hljs-keyword">import</span> mediapipe <span class="hljs-keyword">as</span> mp
<span class="hljs-keyword">from</span> mediapipe.tasks.python.vision.gesture_recognizer_result <span class="hljs-keyword">import</span> (
    GestureRecognizerResult,
)

model_path = <span class="hljs-string">&quot;models/gesture_recognizer.task&quot;</span>
</code></pre>
<p><code>cv2</code> handles webcam capture (<a href="https://docs.opencv.org/4.x/d8/dfe/classcv_1_1VideoCapture.html">Video I/O API</a>), color conversion (<a href="https://docs.opencv.org/4.x/d8/d01/group__imgproc__color__conversions.html">image-processing API</a>), text (<a href="https://docs.opencv.org/4.x/d6/d6e/group__imgproc__draw.html">drawing API</a>), and windows (<a href="https://docs.opencv.org/4.x/d7/dfc/group__highgui.html">HighGUI API</a>). <code>mediapipe</code> provides the <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizer">Gesture Recognizer</a>. <code>time</code> supplies timestamps and the clock used later to estimate FPS. The model path points to the downloaded task bundle.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="8" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-2--configure-the-gesture-recognizer">Step 2 — Configure the gesture recognizer</h2>
<p>Select the MediaPipe Tasks APIs, then create options in video mode:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">BaseOptions = mp.tasks.BaseOptions
GestureRecognizer = mp.tasks.vision.GestureRecognizer
GestureRecognizerOptions = mp.tasks.vision.GestureRecognizerOptions
RunningMode = mp.tasks.vision.RunningMode

options = GestureRecognizerOptions(
    base_options=BaseOptions(model_asset_path=model_path),
    running_mode=RunningMode.VIDEO,
)
</code></pre>
<p><a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/BaseOptions"><code>BaseOptions</code></a> tells MediaPipe which trained model to load. <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizerOptions"><code>GestureRecognizerOptions</code></a> configures the task, and <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/RunningMode"><code>RunningMode</code></a> selects how images are supplied. We use synchronous <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizer"><code>recognize_for_video()</code></a>: it returns the result for the current frame before the loop continues.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="9" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-3--open-the-webcam">Step 3 — Open the webcam</h2>
<p>Create a capture object before starting the processing loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">camera_index = <span class="hljs-number">0</span>  <span class="hljs-comment"># Change this to the webcam index for your computer.</span>
cap = cv2.VideoCapture(camera_index)

<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> cap.isOpened():
    <span class="hljs-keyword">raise</span> RuntimeError(<span class="hljs-string">f&quot;Could not open webcam <span class="hljs-subst">{camera_index}</span>&quot;</span>)
</code></pre>
<p><a href="https://docs.opencv.org/4.x/d8/dfe/classcv_1_1VideoCapture.html">OpenCV's <code>VideoCapture</code> API</a> opens a camera device. Index <code>0</code> is often the default camera, but the correct index varies. Checking <code>isOpened()</code> catches a bad index or unavailable camera before the loop begins.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="10" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-4--create-camera-loop-and-read-one-frame-at-a-time">Step 4 — Create camera loop and read one frame at a time</h2>
<p>Create a loop, read the next frame with <a href="https://docs.opencv.org/4.x/d8/dfe/classcv_1_1VideoCapture.html"><code>VideoCapture.read()</code></a> and show it in a GUI:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">
<span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
    success, frame = cap.read()

    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> success:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Could not read a webcam frame&quot;</span>)
        <span class="hljs-keyword">break</span>

    cv2.imshow(<span class="hljs-string">&quot;Gesture recognition&quot;</span>, frame)
</code></pre>
<p><code>read()</code> returns two values:</p>
<ul>
<li><code>success</code>: whether a frame was captured.</li>
<li><code>frame</code>: the image as a NumPy array when capture succeeds.</li>
</ul>
<p>Stop on a failed read rather than sending an empty frame to MediaPipe. A continuously failing camera would otherwise make the loop spin without producing useful output.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="11" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-5--in-the-loop-let-the-user-stop-the-program">Step 5 — In the loop: Let the user stop the program</h2>
<p>Check for Escape after showing each frame, then always release the camera:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">if</span> cv2.waitKey(<span class="hljs-number">1</span>) &amp; <span class="hljs-number">0xFF</span> == <span class="hljs-number">27</span>:
        <span class="hljs-keyword">break</span>

<span class="hljs-comment"># Outside the loop:</span>
cap.release()
cv2.destroyAllWindows()
</code></pre>
<p>OpenCV's <a href="https://docs.opencv.org/4.x/d7/dfc/group__highgui.html">HighGUI API</a> documents <code>waitKey</code>, which gives the window time to update and reads a key press. The <code>&amp; 0xFF</code> pattern makes the key comparison work across platforms; <code>27</code> is Escape. Releasing the camera and closing OpenCV windows are important cleanup steps.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="12" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-6-test-camera-opening-and-capturing">Step 6: Test camera opening and capturing</h2>
<p>Test the code opening the webcam and capturing the frames in a loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>python gesture-recognition-step-by-step.py
</code></pre>
<p>You should be able to stop the program with <code>ESC</code>.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="13" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-7--know-the-image-formats">Step 7 — Know the image formats</h2>
<p>An image is pixel data, but APIs may expect different channel orders or representations:</p>
<table>
<thead>
<tr>
<th>Name</th>
<th>What it means here</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>BGR</strong></td>
<td>Three-channel NumPy image in Blue, Green, Red order. This is what OpenCV camera capture returns by default.</td>
</tr>
<tr>
<td><strong>RGB</strong></td>
<td>Three-channel NumPy image in Red, Green, Blue order. This is the channel order we pass to MediaPipe.</td>
</tr>
<tr>
<td><strong>SRGB</strong></td>
<td>The MediaPipe image-format label for standard RGB image data. It describes how to interpret the pixel bytes; it does not reorder them.</td>
</tr>
<tr>
<td><strong>Grayscale / BGRA / RGBA</strong></td>
<td>Other common layouts: one intensity channel, or four channels with alpha. They are not the three-channel format used in this example.</td>
</tr>
</tbody>
</table>
<p><strong>Color space</strong> and <strong>channel order</strong> are related but different ideas. Here, the practical issue is that the same three bytes are interpreted in different orders by OpenCV and MediaPipe.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="14" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-8--in-the-loop-convert-bgr-to-rgb">Step 8 — In the loop: convert BGR to RGB</h2>
<p>Convert the captured frame before wrapping it in a MediaPipe <code>Image</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    rgb_frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
    mp_image = mp.Image(
        image_format=mp.ImageFormat.SRGB,
        data=rgb_frame,
    )
</code></pre>
<p>OpenCV's <code>frame</code> is BGR, while the MediaPipe <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/Image"><code>Image</code></a> is declared as <code>SRGB</code> and therefore expects RGB-ordered data. The <code>SRGB</code> label does <strong>not</strong> perform conversion for us; OpenCV's <a href="https://docs.opencv.org/4.x/d8/d01/group__imgproc__color__conversions.html"><code>cvtColor</code></a> changes the channel order.</p>
<p>Without the conversion, red and blue are swapped when the image is interpreted. That can give the recognizer incorrectly colored input and makes the format declaration inaccurate.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="15" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-9--in-the-loop-give-each-frame-a-timestamp">Step 9 — In the loop: give each frame a timestamp</h2>
<p>For every frame, obtain milliseconds from a monotonic clock:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    timestamp_ms = time.monotonic_ns() // <span class="hljs-number">1_000_000</span>
</code></pre>
<p><code>monotonic_ns()</code> is not affected by changes to the computer's wall clock. Dividing nanoseconds by one million converts the value to milliseconds, as expected by the video API.</p>
<p>Video-mode timestamps must increase from frame to frame. Do not use a constant timestamp, and avoid wall-clock time such as <code>time.time()</code> for measuring intervals.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="16" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-10--in-the-loop-recognize-a-gesture">Step 10 — In the loop: recognize a gesture</h2>
<p>Create the recognizer once, <strong>outside the camera loop</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">with</span> GestureRecognizer.create_from_options(options) <span class="hljs-keyword">as</span> recognizer:
     <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
     ...
</code></pre>
<p>Then recognize and display each frame with function <code>display_result</code> (must be defined before):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    ...    
    <span class="hljs-comment"># Inside the webcam loop, after creating mp_image and timestamp_ms:</span>
    result = recognizer.recognize_for_video(mp_image, timestamp_ms)
    <span class="hljs-comment"># Function display_result must be defined outside loop</span>
    display_result(frame, result, fps)
</code></pre>
<p>The <code>with</code> block manages the recognizer's native resources. Creating it once avoids reloading the model for every frame. The <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizer"><code>GestureRecognizer</code> API</a> describes <code>recognize_for_video</code>; it processes one image and returns a <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizerResult"><code>GestureRecognizerResult</code></a>. The result contains gesture classifications and hand landmarks. Each detected hand has its own entries in these lists.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="17" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-11--in-display_result-get-the-gesture-name-and-score">Step 11 — In display_result: get the gesture name and score</h2>
<p>The first classification for the first detected hand can be read like this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> result.gestures <span class="hljs-keyword">and</span> result.gestures[<span class="hljs-number">0</span>]:
    top_gesture = result.gestures[<span class="hljs-number">0</span>][<span class="hljs-number">0</span>]
    label = <span class="hljs-string">f&quot;<span class="hljs-subst">{top_gesture.category_name}</span> (<span class="hljs-subst">{top_gesture.score:<span class="hljs-number">.2</span>f}</span>)&quot;</span>
</code></pre>
<p><code>category_name</code> is the predicted gesture label. <code>score</code> is the model's classification score; formatting it with <code>.2f</code> shows two decimal places. See the <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/GestureRecognizerResult">result API</a> and its linked category type for other returned properties.</p>
<p>The nested list is organized by detected hand, then by category. This snippet displays the highest-ranked category for the <strong>first</strong> hand; a multi-hand application can loop through the hands and their categories.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="18" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-12--in-display_result-draw-landmarks-and-connections">Step 12 — In display_result: draw landmarks and connections</h2>
<p>In MediaPipe 1.1.1, use the Tasks vision drawing tools and hand connection definitions:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">mp_hands = mp.tasks.vision.HandLandmarksConnections
mp_drawing = mp.tasks.vision.drawing_utils
mp_drawing_styles = mp.tasks.vision.drawing_styles

<span class="hljs-keyword">for</span> hand_landmarks <span class="hljs-keyword">in</span> result.hand_landmarks:
    mp_drawing.draw_landmarks(
        annotated_frame,
        hand_landmarks,
        mp_hands.HAND_CONNECTIONS,
        mp_drawing_styles.get_default_hand_landmarks_style(),
        mp_drawing_styles.get_default_hand_connections_style(),
    )
</code></pre>
<p>Each detected hand has 21 normalized landmarks. <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/HandLandmarksConnections"><code>HandLandmarksConnections</code></a> describes which landmark pairs form the hand skeleton. The <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/drawing_utils">drawing utilities API</a> and <a href="https://ai.google.dev/edge/api/mediapipe/python/mp/tasks/vision/drawing_styles">drawing styles API</a> provide the default point and line styles.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="19" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-13--in-display_result-draw-landmarks-on-a-copy">Step 13 — In display_result: draw landmarks on a copy</h2>
<p>Start with a copy so the camera frame remains unchanged, then draw the detected landmarks:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">annotated_frame = frame.copy()

<span class="hljs-keyword">for</span> hand_landmarks <span class="hljs-keyword">in</span> result.hand_landmarks:
    mp_drawing.draw_landmarks(
        annotated_frame,
        hand_landmarks,
        mp_hands.HAND_CONNECTIONS,
        mp_drawing_styles.get_default_hand_landmarks_style(),
        mp_drawing_styles.get_default_hand_connections_style(),
    )
</code></pre>
<p>The drawing helper writes onto the supplied image. <code>annotated_frame</code> is the copy we will display and annotate.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="20" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-14--in-display_result-add-the-gesture-label">Step 14 — In display_result: add the gesture label</h2>
<p>Add the top-ranked gesture label when a classification is available:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> result.gestures <span class="hljs-keyword">and</span> result.gestures[<span class="hljs-number">0</span>]:
    top_gesture = result.gestures[<span class="hljs-number">0</span>][<span class="hljs-number">0</span>]
    label = <span class="hljs-string">f&quot;<span class="hljs-subst">{top_gesture.category_name}</span> (<span class="hljs-subst">{top_gesture.score:<span class="hljs-number">.2</span>f}</span>)&quot;</span>
    cv2.putText(
        annotated_frame, label, (<span class="hljs-number">10</span>, <span class="hljs-number">30</span>),
        cv2.FONT_HERSHEY_SIMPLEX, <span class="hljs-number">1</span>, (<span class="hljs-number">0</span>, <span class="hljs-number">255</span>, <span class="hljs-number">0</span>), <span class="hljs-number">2</span>,
    )
</code></pre>
<p>The text origin <code>(10, 30)</code> is near the upper-left corner. OpenCV's <a href="https://docs.opencv.org/4.x/d6/d6e/group__imgproc__draw.html"><code>putText</code> API</a> uses BGR color order too; <code>(0, 255, 0)</code> is green in either RGB or BGR because its red and blue components are zero.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="21" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-15--in-display_result-draw-the-fps-and-show-the-window">Step 15 — In display_result: draw the FPS and show the window</h2>
<p>Add an FPS overlay on every frame, even if no hand is detected:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cv2.putText(
    annotated_frame,
    <span class="hljs-string">f&quot;FPS: <span class="hljs-subst">{fps:<span class="hljs-number">.1</span>f}</span>&quot;</span>,
    (<span class="hljs-number">10</span>, <span class="hljs-number">65</span>),
    cv2.FONT_HERSHEY_SIMPLEX,
    <span class="hljs-number">0.8</span>,
    (<span class="hljs-number">0</span>, <span class="hljs-number">255</span>, <span class="hljs-number">0</span>),
    <span class="hljs-number">2</span>,
)
cv2.imshow(<span class="hljs-string">&quot;Gesture recognition&quot;</span>, annotated_frame)
</code></pre>
<p>This FPS estimates the rate at which successful camera frames reach the loop. It includes recognition and display work between reads, as well as camera timing; it is not a benchmark of the model alone. OpenCV's <a href="https://docs.opencv.org/4.x/d7/dfc/group__highgui.html">HighGUI API</a> documents <code>imshow</code> and the related window and keyboard functions.</p>
<footer>Assistive Technologies Platformen - Hand Gesture Recognition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-footer="Assistive Technologies Platformen - Hand Gesture Recognition" data-paginate="true" data-theme="fhtw" lang="en-US" data-marpit-pagination="22" style="--footer:Assistive Technologies Platformen - Hand Gesture Recognition;--paginate:true;--theme:fhtw;" data-marpit-pagination-total="29">
<h2 id="step-16--in-the-loop-calculate-the-frame-rate">Step 16 — In the loop: calculate the frame rate</h2>
<p>To estimate the displayed stream rate, measure the time between successful frame reads:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">previous_frame_time = <span class="hljs-literal">None</span>

<span class="hljs-comment"># After a successful cap.read():</span>
frame_time = time.perf_counter()
fps = <span class="hljs-number">0.0</span>
<span class="hljs-keyword">if</span> previous_frame_time <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:
    elapsed_seconds = frame_time - previous_frame_time
    <span class="hljs-keyword">if</span> elapsed_seconds &gt; <span class="hljs-number">0</span>:
        fps = <span class="hljs-number">1.0</span> / elapsed_seconds
previous_frame_time = frame_time
</code></pre>
<p><code>perf_counter()</code> is a high-resolution monotonic clock for measuring elapsed time. One frame divided by the seconds between frames gives frames per second: <strong>FPS = 1 / elapsed_seconds</strong>.</p>
<p>The first frame has no previous timestamp, so its FPS starts at <code>0.0</code>. This is an interval estimate, so it can fluctuate from frame to frame; smoothing multiple intervals can make the display steadier.</p>

</section>

<h2 id="complete-program-16-setup">Complete program (1/6): setup</h2>
<p>This first part combines the imports and recognizer configuration:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> time

<span class="hljs-keyword">import</span> cv2
<span class="hljs-keyword">import</span> mediapipe <span class="hljs-keyword">as</span> mp
<span class="hljs-keyword">from</span> mediapipe.tasks.python.vision.gesture_recognizer_result <span class="hljs-keyword">import</span> (

model_path = <span class="hljs-string">&quot;models/gesture_recognizer.task&quot;</span>

GestureRecognizerOptions = mp.tasks.vision.GestureRecognizerOptions

<h2 id="complete-program-26-draw-the-landmarks">Complete program (2/6): draw the landmarks</h2>
<p>Add this function after the setup. It draws all detected hands:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">display_result</span>(<span class="hljs-params">frame, result: GestureRecognizerResult, fps: <span class="hljs-built_in">float</span></span>) -&gt; <span class="hljs-literal">None</span>:
    annotated_frame = frame.copy()

    <span class="hljs-keyword">for</span> hand_landmarks <span class="hljs-keyword">in</span> result.hand_landmarks:
        mp_drawing.draw_landmarks(
            annotated_frame,
            hand_landmarks,
            mp_hands.HAND_CONNECTIONS,
            mp_drawing_styles.get_default_hand_landmarks_style(),
            mp_drawing_styles.get_default_hand_connections_style(),
        )

<h2 id="complete-program-46-open-the-webcam">Complete program (4/6): open the webcam</h2>
<p>Start the camera loop below the display function. Continue the indented loop body on the next slides:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">camera_index = <span class="hljs-number">0</span>
cap = cv2.VideoCapture(camera_index)
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> cap.isOpened():
    <span class="hljs-keyword">raise</span> RuntimeError(<span class="hljs-string">f&quot;Could not open webcam <span class="hljs-subst">{camera_index}</span>&quot;</span>)

previous_frame_time = <span class="hljs-literal">None</span>
<span class="hljs-keyword">try</span>:
    <span class="hljs-keyword">with</span> GestureRecognizer.create_from_options(options) <span class="hljs-keyword">as</span> recognizer:

<h2 id="complete-program-56-capture-and-measure">Complete program (5/6): capture and measure</h2>
<p>Continue inside the <code>while True:</code> loop at the same indentation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            success, frame = cap.read()
            <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> success:
                <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Could not read a webcam frame&quot;</span>)
                <span class="hljs-keyword">break</span>

            frame_time = time.perf_counter()
            fps = <span class="hljs-number">0.0</span>
            <span class="hljs-keyword">if</span> previous_frame_time <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:
                elapsed_seconds = frame_time - previous_frame_time
                <span class="hljs-keyword">if</span> elapsed_seconds &gt; <span class="hljs-number">0</span>:
                    fps = <span class="hljs-number">1.0</span> / elapsed_seconds
            previous_frame_time = frame_time

<h2 id="complete-program-66-recognize-and-clean-up">Complete program (6/6): recognize and clean up</h2>
<p>Continue the same loop. The <code>finally</code> block releases resources even if capture or recognition raises an error:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            rgb_frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
            mp_image = mp.Image(
                image_format=mp.ImageFormat.SRGB, data=rgb_frame
            )
            timestamp_ms = time.monotonic_ns() // <span class="hljs-number">1_000_000</span>
            result = recognizer.recognize_for_video(mp_image, timestamp_ms)
            display_result(frame, result, fps)

            <span class="hljs-keyword">if</span> cv2.waitKey(<span class="hljs-number">1</span>) &amp; <span class="hljs-number">0xFF</span> == <span class="hljs-number">27</span>:
                <span class="hljs-keyword">break</span>

    cap.release()
